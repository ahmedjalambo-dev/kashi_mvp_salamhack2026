<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Kashi · Mobile App Design — Print</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="../colors_and_type.css"/>
  <style>
    * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    html, body { margin: 0; padding: 0; background: #F4F1EB; font-family: 'Inter', system-ui, sans-serif; color: #1A1A1A; }

    .cover {
      page-break-after: always;
      break-after: page;
      width: 100%;
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 60px 80px;
      background: #FAF8F5;
    }
    .cover .mark {
      width: 120px; height: 120px; border-radius: 32px; background: #2D5F3F;
      display: grid; place-items: center; margin-bottom: 32px;
    }
    .cover h1 { font-size: 56px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
    .cover .ar { font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 42px; font-weight: 700; color: #2D5F3F; margin-bottom: 24px; }
    .cover .sub { font-size: 16px; color: #6B6B6B; max-width: 560px; text-align: center; line-height: 1.6; margin-bottom: 40px; }
    .cover .meta { display: flex; gap: 32px; font-size: 12px; color: #6B6B6B; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
    .cover .meta b { color: #1A1A1A; display: block; margin-top: 4px; font-size: 14px; letter-spacing: 0; text-transform: none; }

    .section {
      page-break-before: always;
      break-before: page;
      padding: 32px 40px 48px;
      min-height: 100vh;
    }
    .section:first-of-type { page-break-before: auto; }
    .section-head {
      border-bottom: 1px solid #E8E5E0; padding-bottom: 16px; margin-bottom: 28px;
      display: flex; align-items: baseline; gap: 16px;
    }
    .section-head .num { font-family: 'JetBrains Mono', monospace; color: #6B6B6B; font-size: 14px; font-weight: 500; }
    .section-head h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; margin: 0; flex: 1; }
    .section-head .sub { font-size: 13px; color: #6B6B6B; max-width: 420px; line-height: 1.5; text-align: right; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px 24px;
    }
    .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }

    .ab {
      break-inside: avoid;
      page-break-inside: avoid;
      display: flex; flex-direction: column; gap: 10px;
      align-items: center;
    }
    .ab .label {
      font-size: 11px; color: #6B6B6B; font-weight: 600; letter-spacing: 0.04em;
      align-self: flex-start;
    }
    .android-frame {
      width: 240px; height: 472px;
      border-radius: 26px; padding: 6px; background: #1a1a1a;
      box-shadow: 0 8px 24px -8px rgba(0,0,0,0.18);
      position: relative; overflow: hidden;
    }
    .android-frame::before {
      content: ""; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      width: 6px; height: 6px; background: #0a0a0a; border-radius: 999px; z-index: 5;
    }
    .android-screen {
      width: 100%; height: 100%; border-radius: 20px; overflow: hidden; background: #FAF8F5;
      display: flex; flex-direction: column;
      transform: scale(0.582); transform-origin: top left;
      width: 412px; height: 812px;
    }
    .android-frame {
      /* Outer container does the scaling math */
      width: 240px; height: 472px;
    }
    .ab .scaler {
      width: 240px; height: 472px; position: relative; overflow: hidden;
      border-radius: 20px; background: #FAF8F5;
    }
    .ab .scaler > .android-screen {
      transform: scale(0.582);
      transform-origin: top left;
      width: 412px; height: 812px;
    }

    @page {
      size: A4 landscape;
      margin: 0.6cm;
    }
    @media print {
      body { background: #fff; }
      .section { padding: 16px 20px 24px; min-height: auto; }
    }
  </style>
</head>
<body>

  <div class="cover">
    <div class="mark">
      <svg width="74" height="74" viewBox="0 0 64 64" fill="none">
        <path d="M40 16 C 24 22, 18 38, 22 50 C 40 46, 52 32, 50 18 C 46 16, 43 15, 40 16 Z" fill="#FAF8F5"/>
        <path d="M24 46 L 46 22" stroke="#2D5F3F" strokeWidth="2" stroke-linecap="round" opacity="0.5"/>
        <circle cx="35" cy="32" r="3" fill="#D4A24C"/>
      </svg>
    </div>
    <h1>Kashi</h1>
    <div class="ar">كاشي</div>
    <div class="sub">A Palestinian digital wallet built for the realities of life in Gaza and the West Bank — with a hero feature: fully-offline peer-to-peer payments via signed QR codes.</div>
    <div class="meta">
      <div>System<b>Mobile App</b></div>
      <div>Screens<b>20 + RTL</b></div>
      <div>Date<b>April 2026</b></div>
    </div>
  </div>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="atoms.jsx"></script>
  <script type="text/babel" src="composites.jsx"></script>
  <script type="text/babel" src="screens-onboarding.jsx"></script>
  <script type="text/babel" src="screens-send.jsx"></script>
  <script type="text/babel" src="screens-receive-transfer.jsx"></script>

  <script type="text/babel">
    function Phone({ children }) {
      return (
        <div className="scaler">
          <div className="android-screen">{children}</div>
        </div>
      );
    }

    const AB = ({ id, label, children }) => (
      <div className="ab" key={id}>
        <div className="label">{label}</div>
        <div className="android-frame"><Phone>{children}</Phone></div>
      </div>
    );

    function Section({ num, title, sub, cols, children }) {
      return (
        <section className="section">
          <div className="section-head">
            <span className="num">{num}</span>
            <h2>{title}</h2>
            <div className="sub">{sub}</div>
          </div>
          <div className={"grid " + (cols === 2 ? "cols-2" : "")}>{children}</div>
        </section>
      );
    }

    function App() {
      return (
        <>
          <Section num="01" title="Onboarding & Auth" sub="The first 90 seconds — phone-based signup with auto-issued PS-IBAN.">
            <AB id="01-splash"  label="01 · Splash"        ><ScreenSplash/></AB>
            <AB id="02-phone"   label="02 · Phone login"   ><ScreenPhone/></AB>
            <AB id="03-otp"     label="03 · OTP verify"    ><ScreenOTP/></AB>
            <AB id="04-profile" label="04 · Profile setup" ><ScreenProfile/></AB>
          </Section>

          <Section num="02" title="Home" sub="Wallet balance is sacred. Three primary actions, recent activity below.">
            <AB id="05-home"      label="05 · Home (online)"  ><ScreenHome sync="online"/></AB>
            <AB id="05b-home-off" label="05b · Home (offline)"><ScreenHome sync="offline"/></AB>
            <AB id="05c-home-pen" label="05c · Home (pending)"><ScreenHome sync="pending"/></AB>
          </Section>

          <Section num="03" title="Receive / Top-up" sub="Cash in via E-SADAD from any Palestinian bank app." cols={2}>
            <AB id="06-receive" label="06 · Receive money"   ><ScreenReceive/></AB>
            <AB id="07-success" label="07 · Top-up success"  ><ScreenReceiveSuccess/></AB>
          </Section>

          <Section num="04" title="★ Offline P2P Send — the hero flow" sub="Cryptographically-signed payments that work without network. Treat the QR moment ceremonially.">
            <AB id="08-amount"    label="08 · Amount"          ><ScreenSendAmount offline/></AB>
            <AB id="09-qr"        label="09 · QR display"      ><ScreenSendQR/></AB>
            <AB id="10-bt"        label="10 · Bluetooth radar" ><ScreenSendBT/></AB>
            <AB id="11-pending"   label="11 · Pending sync"    ><ScreenSendPending/></AB>
            <AB id="12-confirmed" label="12 · Online confirmed"><ScreenSendConfirmed/></AB>
          </Section>

          <Section num="05" title="★ Offline P2P Receive" sub="Trust moment: verify the signature, accept, settle later.">
            <AB id="13-scan"    label="13 · Scan"             ><ScreenScan/></AB>
            <AB id="14-verify"  label="14 · Verify (trust)"   ><ScreenVerify/></AB>
            <AB id="15-pending" label="15 · Accepted, pending"><ScreenReceivePending/></AB>
            <AB id="16-history" label="16 · History detail"   ><ScreenHistoryDetail/></AB>
          </Section>

          <Section num="06" title="iBuraq · Outbound bank transfer" sub="Lookup any phone, find linked bank accounts and wallets, send.">
            <AB id="17-lookup"  label="17 · Lookup"            ><ScreenLookup/></AB>
            <AB id="18-pick"    label="18 · Pick destination"  ><ScreenDestinations/></AB>
            <AB id="19-confirm" label="19 · Confirm"           ><ScreenTransferConfirm/></AB>
            <AB id="20-sent"    label="20 · Sent"              ><ScreenTransferSuccess/></AB>
          </Section>

          <Section num="07" title="Arabic / RTL — mirrored screens" sub="Arabic is the primary locale. Layouts mirror; numerals stay tabular; the wallet card direction flips.">
            <AB id="r1-splash" label="ar · Splash"      ><ScreenSplash dir="rtl"/></AB>
            <AB id="r2-phone"  label="ar · Phone login" ><ScreenPhone dir="rtl"/></AB>
            <AB id="r3-home"   label="ar · Home"        ><ScreenHome dir="rtl" sync="online"/></AB>
            <AB id="r4-amount" label="ar · Send amount" ><ScreenSendAmount dir="rtl" offline/></AB>
            <AB id="r5-verify" label="ar · Verify"      ><ScreenVerify dir="rtl"/></AB>
          </Section>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

    // Auto-print once everything's settled.
    (async () => {
      try { await document.fonts.ready; } catch (e) {}
      await new Promise(r => setTimeout(r, 800));
      window.print();
    })();
  </script>
</body>
</html>
